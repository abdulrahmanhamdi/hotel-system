name: CI/CD Testing & QA Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Coverage Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: hotel_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Static Analysis & Linter
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

      - name: Security Vulnerability Scan (gosec)
        run: |
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
          gosec -exclude-dir=docs -exclude-dir=tmp ./...

      - name: Run Complete Test Suite with Coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: hotel_test_db
          JWT_SECRET: ci-test-secret-key-super-secure-32chars

      - name: Display Total Coverage Percentage
        run: |
          go tool cover -func=coverage.out | grep total

      - name: Compile Production Binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o bin/hotel-api cmd/api/main.go

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
