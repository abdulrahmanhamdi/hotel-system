services:
  postgres:
    image: postgres:15-alpine
    container_name: hotel_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-hotel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotel_secure_password}
      POSTGRES_DB: ${DB_NAME:-hotel_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hotel_user} -d ${DB_NAME:-hotel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: hotel_api
    restart: always
    environment:
      PORT: ${APP_PORT:-8080}
      APP_PORT: ${APP_PORT:-8080}
      ENV: development
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hotel_user}
      DB_PASSWORD: ${DB_PASSWORD:-hotel_secure_password}
      DB_NAME: ${DB_NAME:-hotel_db}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-super-secret-hotel-jwt-token-key-2026}
      JWT_EXPIRATION_HOURS: 24
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/tmp
    command: ["./scripts/wait-for-db.sh", "postgres:5432", "air", "-c", ".air.toml"]
    networks:
      - hotel_network

  adminer:
    image: adminer:latest
    container_name: hotel_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - hotel_network

volumes:
  postgres_data:

networks:
  hotel_network:
    driver: bridge
