basePath: /api/v1
definitions:
  hotel-backend_internal_models.CreateBookingRequest:
    properties:
      check_in_date:
        description: YYYY-MM-DD
        type: string
      check_out_date:
        description: YYYY-MM-DD
        type: string
      guest_id:
        type: integer
      initial_payment:
        properties:
          amount:
            type: number
          payment_method:
            type: string
        type: object
      room_id:
        type: integer
      special_requests:
        type: string
    required:
    - check_in_date
    - check_out_date
    - guest_id
    - room_id
    type: object
  hotel-backend_internal_models.CreateGuestRequest:
    properties:
      address:
        type: string
      email:
        type: string
      first_name:
        type: string
      id_card_or_passport:
        type: string
      last_name:
        type: string
      phone:
        type: string
    required:
    - email
    - first_name
    - id_card_or_passport
    - last_name
    - phone
    type: object
  hotel-backend_internal_models.CreatePaymentRequest:
    properties:
      amount:
        type: number
      booking_id:
        type: integer
      notes:
        type: string
      payment_method:
        $ref: '#/definitions/hotel-backend_internal_models.PaymentMethod'
    required:
    - amount
    - booking_id
    - payment_method
    type: object
  hotel-backend_internal_models.CreateRoomRequest:
    properties:
      floor:
        type: integer
      room_number:
        type: string
      room_type_id:
        type: integer
      status:
        $ref: '#/definitions/hotel-backend_internal_models.RoomStatus'
    required:
    - floor
    - room_number
    - room_type_id
    type: object
  hotel-backend_internal_models.CreateRoomTypeRequest:
    properties:
      amenities:
        type: string
      base_price_per_night:
        type: number
      capacity:
        type: integer
      description:
        type: string
      name:
        type: string
    required:
    - base_price_per_night
    - capacity
    - name
    type: object
  hotel-backend_internal_models.PaymentMethod:
    enum:
    - cash
    - credit_card
    - debit_card
    - bank_transfer
    type: string
    x-enum-varnames:
    - PaymentMethodCash
    - PaymentMethodCreditCard
    - PaymentMethodDebitCard
    - PaymentMethodBankTransfer
  hotel-backend_internal_models.Role:
    enum:
    - admin
    - receptionist
    - housekeeping
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleReceptionist
    - RoleHousekeeping
  hotel-backend_internal_models.RoomStatus:
    enum:
    - available
    - occupied
    - cleaning
    - maintenance
    type: string
    x-enum-varnames:
    - RoomStatusAvailable
    - RoomStatusOccupied
    - RoomStatusCleaning
    - RoomStatusMaintenance
  hotel-backend_internal_models.UpdateBookingRequest:
    properties:
      check_in_date:
        type: string
      check_out_date:
        type: string
      room_id:
        type: integer
      special_requests:
        type: string
    type: object
  hotel-backend_internal_models.UpdateGuestRequest:
    properties:
      address:
        type: string
      email:
        type: string
      first_name:
        type: string
      id_card_or_passport:
        type: string
      last_name:
        type: string
      phone:
        type: string
    type: object
  hotel-backend_internal_models.UpdateRoomRequest:
    properties:
      floor:
        type: integer
      is_active:
        type: boolean
      room_number:
        type: string
      room_type_id:
        type: integer
      status:
        $ref: '#/definitions/hotel-backend_internal_models.RoomStatus'
    type: object
  hotel-backend_internal_models.UpdateRoomStatusRequest:
    properties:
      status:
        $ref: '#/definitions/hotel-backend_internal_models.RoomStatus'
    required:
    - status
    type: object
  hotel-backend_internal_models.UpdateRoomTypeRequest:
    properties:
      amenities:
        type: string
      base_price_per_night:
        type: number
      capacity:
        type: integer
      description:
        type: string
      name:
        type: string
    type: object
  hotel-backend_internal_models.UserLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  hotel-backend_internal_models.UserRegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      role:
        $ref: '#/definitions/hotel-backend_internal_models.Role'
    required:
    - email
    - name
    - password
    - role
    type: object
  hotel-backend_internal_models.UserUpdateRequest:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      role:
        $ref: '#/definitions/hotel-backend_internal_models.Role'
    type: object
host: localhost:8080
info:
  contact:
    email: support@hotel-system.com
    name: API Support
  description: This is the API documentation for the Hotel Management System.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Hotel Management System API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password to obtain a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/hotel-backend_internal_models.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful with token and user profile
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body or missing credentials
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid email or password
          schema:
            additionalProperties: true
            type: object
      summary: User login
      tags:
      - Auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Retrieve the profile details of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: Profile retrieved
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Auth
  /bookings:
    get:
      consumes:
      - application/json
      description: Retrieve a list of bookings with optional filters for status, guest_id,
        and date range
      parameters:
      - description: Booking Status (pending, confirmed, checked_in, checked_out,
          cancelled)
        in: query
        name: status
        type: string
      - description: Guest ID
        in: query
        name: guest_id
        type: integer
      - description: From date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: To date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Bookings retrieved
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all bookings
      tags:
      - Bookings
    post:
      consumes:
      - application/json
      description: Reserve a room for a guest with automatic stay calculation and
        pricing (Admin and Receptionist)
      parameters:
      - description: Booking request payload
        in: body
        name: booking
        required: true
        schema:
          $ref: '#/definitions/hotel-backend_internal_models.CreateBookingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Booking created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error or date conflict
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a new booking
      tags:
      - Bookings
  /bookings/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve details of a booking including guest, room, payments,
        and staff info
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Booking retrieved
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid booking ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Booking not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get booking by ID
      tags:
      - Bookings
    put:
      consumes:
      - application/json
      description: Update booking details, status, or special requests
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      - description: Booking update payload
        in: body
        name: booking
        required: true
        schema:
          $ref: '#/definitions/hotel-backend_internal_models.UpdateBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Booking updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Booking not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update booking
      tags:
      - Bookings
  /bookings/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Cancel a booking and release the reserved room
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Booking cancelled successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid state for cancellation
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cancel booking
      tags:
      - Bookings
  /bookings/{id}/check-in:
    post:
      consumes:
      - application/json
      description: Process check-in for a booking and set room status to occupied
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Guest checked in successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid state for check-in
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Check-in guest
      tags:
      - Bookings
  /bookings/{id}/check-out:
    post:
      consumes:
      - application/json
      description: Process check-out for a booking and set room status to cleaning
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Guest checked out successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid state for check-out
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Check-out guest
      tags:
      - Bookings
  /bookings/payments:
    post:
      consumes:
      - application/json
      description: Record a new payment (cash, credit_card, debit_card, bank_transfer)
        for a booking
      parameters:
      - description: Payment details
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/hotel-backend_internal_models.CreatePaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Payment recorded successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Add payment to booking
      tags:
      - Bookings
  /bookings/reference/{ref}:
    get:
      consumes:
      - application/json
      description: Find a booking by its unique reference number (e.g. BK-20260216-ABCD)
      parameters:
      - description: Booking Reference Code
        in: path
        name: ref
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Booking retrieved
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Booking reference is required
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Booking not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get booking by reference code
      tags:
      - Bookings
  /guests:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all registered guests with optional search by
        name, email, or phone
      parameters:
      - description: Search query (name, email, phone)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Guests retrieved
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all guests
      tags:
      - Guests
    post:
      consumes:
      - application/json
      description: Add a new guest profile to the system (Admin and Receptionist)
      parameters:
      - description: Guest data
        in: body
        name: guest
        required: true
        schema:
          $ref: '#/definitions/hotel-backend_internal_models.CreateGuestRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Guest registered successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Register a new guest
      tags:
      - Guests
  /guests/{id}:
    delete:
      consumes:
      - application/json
      description: Remove a guest record from the system (Admin only)
      parameters:
      - description: Guest ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Guest deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid guest ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Admin only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to delete guest
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete guest
      tags:
      - Guests
    get:
      consumes:
      - application/json
      description: Retrieve details of a specific guest by ID
      parameters:
      - description: Guest ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Guest retrieved
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid guest ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Guest not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get guest by ID
      tags:
      - Guests
    put:
      consumes:
      - application/json
      description: Modify an existing guest's contact or identification details
      parameters:
      - description: Guest ID
        in: path
        name: id
        required: true
        type: integer
      - description: Guest update data
        in: body
        name: guest
        required: true
        schema:
          $ref: '#/definitions/hotel-backend_internal_models.UpdateGuestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Guest updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Guest not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update guest
      tags:
      - Guests
  /reports/occupancy:
    get:
      consumes:
      - application/json
      description: Calculate current hotel occupancy rate and room status distribution
        (Admin and Receptionist)
      produces:
      - application/json
      responses:
        "200":
          description: Occupancy report retrieved
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to calculate occupancy report
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get occupancy report
      tags:
      - Reports
  /reports/revenue:
    get:
      consumes:
      - application/json
      description: Calculate revenue metrics by room type, payment method, and summary
        within an optional date range (Admin only)
      parameters:
      - description: From date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: To date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Revenue report retrieved
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Admin only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to calculate revenue report
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get revenue report
      tags:
      - Reports
  /room-types:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all room categories
      produces:
      - application/json
      responses:
        "200":
          description: Room types retrieved
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all room types
      tags:
      - Room Types
    post:
      consumes:
      - application/json
      description: Add a new room category (Admin only)
      parameters:
      - description: Room type details
        in: body
        name: room_type
        required: true
        schema:
          $ref: '#/definitions/hotel-backend_internal_models.CreateRoomTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Room type created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Admin only
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create room type
      tags:
      - Room Types
  /room-types/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a room type by ID (Admin only)
      parameters:
      - description: Room Type ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Room type deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid room type ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Admin only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to delete room type
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete room type
      tags:
      - Room Types
    get:
      consumes:
      - application/json
      description: Retrieve details of a specific room type
      parameters:
      - description: Room Type ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Room type retrieved
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid room type ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Room type not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get room type by ID
      tags:
      - Room Types
    put:
      consumes:
      - application/json
      description: Modify an existing room type's details (Admin only)
      parameters:
      - description: Room Type ID
        in: path
        name: id
        required: true
        type: integer
      - description: Room type update data
        in: body
        name: room_type
        required: true
        schema:
          $ref: '#/definitions/hotel-backend_internal_models.UpdateRoomTypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Room type updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Admin only
          schema:
            additionalProperties: true
            type: object
        "404":
