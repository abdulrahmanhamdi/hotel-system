<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="hotelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#112240" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
  </defs>

  <!-- Background rounded box -->
  <rect width="32" height="32" rx="6" fill="url(#hotelGrad)" />

  <!-- Hotel building structure -->
  <!-- Left wing -->
  <rect x="5" y="10" width="6" height="17" rx="1" fill="url(#goldGrad)" opacity="0.85" />
  <!-- Main central tower -->
  <rect x="11" y="5" width="10" height="22" rx="1.5" fill="url(#goldGrad)" />
  <!-- Right wing -->
  <rect x="21" y="10" width="6" height="17" rx="1" fill="url(#goldGrad)" opacity="0.85" />

  <!-- Roof ornament / star -->
  <polygon points="16,2.5 17.2,4.8 19.8,4.8 17.7,6.3 18.5,8.8 16,7.2 13.5,8.8 14.3,6.3 12.2,4.8 14.8,4.8" fill="#FFFFFF" opacity="0.9" />

  <!-- Windows in central tower -->
  <rect x="13" y="10" width="2" height="2" rx="0.5" fill="#0A192F" />
  <rect x="17" y="10" width="2" height="2" rx="0.5" fill="#0A192F" />
  <rect x="13" y="14" width="2" height="2" rx="0.5" fill="#0A192F" />
  <rect x="17" y="14" width="2" height="2" rx="0.5" fill="#0A192F" />
  <rect x="13" y="18" width="2" height="2" rx="0.5" fill="#0A192F" />
  <rect x="17" y="18" width="2" height="2" rx="0.5" fill="#0A192F" />

  <!-- Windows in left wing -->
  <rect x="7" y="13" width="2" height="2" rx="0.5" fill="#0A192F" />
  <rect x="7" y="17" width="2" height="2" rx="0.5" fill="#0A192F" />
  <rect x="7" y="21" width="2" height="2" rx="0.5" fill="#0A192F" />

  <!-- Windows in right wing -->
  <rect x="23" y="13" width="2" height="2" rx="0.5" fill="#0A192F" />
  <rect x="23" y="17" width="2" height="2" rx="0.5" fill="#0A192F" />
  <rect x="23" y="21" width="2" height="2" rx="0.5" fill="#0A192F" />

  <!-- Grand Entrance Door -->
  <path d="M14 27 V23 Q16 21 18 23 V27 Z" fill="#0A192F" />
</svg>